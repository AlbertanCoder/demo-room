<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>MARK III</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MARK III">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  /* 12 Nov 2026, phone clean-up: the same look as the page behind it (black, the yellow, white; system letters;
     nothing under the clock, the notch or the home bar).
     13 Nov 2026 (v4, plan step 18): the lock takes a second key as well as the password; see the script. */
  :root { --bg: #000000; --ink: #ffffff; --soft: #a3aab1; --line: rgba(255, 255, 255, 0.24); --yellow: #ffc21a; --bad: #ff9d8a;
    --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html { height: 100%; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: calc(var(--sat) + 11vh) calc(var(--sar) + 24px) calc(var(--sab) + 20px) calc(var(--sal) + 24px); }
  form { width: 100%; max-width: 360px; }
  .mark { display: block; width: 72px; height: 72px; border-radius: 18px; margin: 0 0 18px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: 0.08em; font-weight: 800; }
  p { margin: 0 0 22px; color: var(--soft); font-size: 17px; }
  input[type=password] { display: block; width: 100%; height: 54px; font: inherit; font-size: 18px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.07); color: var(--ink); outline: none; -webkit-appearance: none; appearance: none; }
  input[type=password]:focus { border-color: var(--yellow); }
  #keyRow { margin: 0 0 10px; }
  label.keep { display: flex; gap: 12px; align-items: center; min-height: 48px; margin: 8px 0 12px; color: var(--soft); font-size: 17px; }
  label.keep input { flex: 0 0 auto; width: 24px; height: 24px; margin: 0; accent-color: var(--yellow); }
  button { display: block; width: 100%; height: 56px; font: inherit; font-weight: 800; letter-spacing: 0.08em; border-radius: 16px; border: 0; background: var(--yellow); color: #111111; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
  button[disabled] { opacity: .6; }
  #msg { min-height: 3em; margin: 14px 0 0; color: var(--bad); font-size: 17px; }
  #msg.wait { color: var(--soft); }
  @media (orientation: landscape) and (max-height: 540px) {
    body { padding-top: calc(var(--sat) + 14px); }
    form { max-width: 620px; display: grid; grid-template-columns: 72px 1fr; column-gap: 20px; align-items: center; }
    .mark { margin: 0; grid-row: 1 / 3; }
    h1 { margin: 0; align-self: end; }
    p { margin: 0 0 8px; align-self: start; }
    input[type=password], #keyRow, label.keep, button, #msg { grid-column: 1 / -1; }
    label.keep { margin: 4px 0 6px; }
    #msg { min-height: 1.5em; margin-top: 8px; }
  }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <img class="mark" src="../../icons/icon-180.png" alt="" width="64" height="64">
  <h1>MARK III</h1>
  <p id="lead">Private demo. Enter the password.</p>
  <div id="keyRow" hidden><input type="password" id="k2" autocomplete="off" aria-label="Key for this device" placeholder="Key for this device"></div>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
  <label class="keep"><input type="checkbox" id="keep" checked>Remember on this device</label>
  <button id="go" type="submit">OPEN</button>
  <p id="msg" role="status"></p>
</form>

  if (!dev) askKey();

  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
    say('This browser is too old to open it. Use Safari or Chrome, updated.');
    btn.disabled = true;
    return;
  }

  function open(rawKey, before) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, k, bytes(DATA)); })
      .then(function (zipped) {
        var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      })
      .then(function (html) {
        if (before) before();
        document.open();
        document.write(html);
        document.close();
      });
  }

  function derive(pw, devKey) {
    // the salt is the page's own salt followed by the 32 bytes of the device key
    var a = bytes(SALT), b = bytes(devKey.replace(/-/g, '+').replace(/_/g, '/') + '='), salt = new Uint8Array(a.length + b.length);
    salt.set(a, 0);
    salt.set(b, a.length);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: ROUNDS, hash: 'SHA-256' }, k, 256); });
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    var pasted = clean(keyBox.value);
    var useKey = pasted || dev;
    if (!useKey) {
      askKey();
      say('This device needs its key first. Open your private link, or paste the key in the first box.');
      return;
    }
    btn.disabled = true;
    say('Opening…', true);
    // read the tick now: once the page opens, this form is gone
    var keep = document.getElementById('keep').checked;
    derive(pw, useKey).then(function (raw) {
      // remembered only once it has really unlocked, just before the page is written over this form
      return open(raw, function () { if (keep) { putDev(true, useKey); put(BUILT + ':' + b64(raw)); } });
    }).catch(function () {
      btn.disabled = false;
      fails += 1;
      if (fails >= 2) keyRow.hidden = false; // perhaps the key kept on this device is an old one: it can be pasted again
      say(pasted ? 'That did not work. Check the key and the password, and try again.' : 'That password did not work. Check it and try again.');
    });
  });

  // remembered on this device: open straight away (a new version needs the password once more)
  var saved = get();
  if (saved && saved.indexOf(BUILT + ':') === 0) {
    say('Opening…', true);
    open(bytes(saved.slice(BUILT.length + 1))).catch(function () { put(null); say(''); });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../../sw.js').catch(function () {});
  }
}());
</script>
</body>
</html>
