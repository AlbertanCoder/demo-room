<style>
  :root { --bg: #0d1013; --card: #161a1f; --ink: #e9e6df; --soft: #9aa1ab; --line: #2c3138; --yellow: #f0b429; --bad: #ff8a75; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; }
  .mark { display: block; width: 64px; height: 64px; border-radius: 14px; margin: 0 0 12px; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: .5px; }
  p { margin: 0 0 14px; color: var(--soft); font-size: .95rem; }
  input[type=password] { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  label.keep { display: flex; gap: 10px; align-items: center; margin: 12px 0 16px; color: var(--soft); font-size: .95rem; }
  label.keep input { width: 22px; height: 22px; accent-color: var(--yellow); }
  button { width: 100%; font: inherit; font-weight: 700; letter-spacing: .5px; padding: 13px; border-radius: 10px; border: 0; background: var(--yellow); color: #1d1f23; cursor: pointer; }
  button[disabled] { opacity: .6; }
  #msg { min-height: 1.5em; margin: 12px 0 0; color: var(--bad); font-size: .95rem; }
  #msg.wait { color: var(--soft); }
</style>
</head>

</form>

  var KEY = 'k1';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('go');

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function put(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function say(t, wait) { msg.textContent = t; msg.className = wait ? 'wait' : ''; }

  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
    say('This browser is too old to open it. Use Safari or Chrome, updated.');
    btn.disabled = true;
    return;
  }

  function open(rawKey, before) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, k, bytes(DATA)); })
      .then(function (zipped) {
        var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      })
      .then(function (html) {
        if (before) before();
        document.open();
        document.write(html);
        document.close();
      });
  }

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(SALT), iterations: ROUNDS, hash: 'SHA-256' }, k, 256); });
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    btn.disabled = true;
    say('Opening…', true);
    // read the tick now: once the page opens, this form is gone
    var keep = document.getElementById('keep').checked;
    derive(pw).then(function (raw) {
      // remembered only once it has really unlocked, just before the page is written over this form
      return open(raw, function () { if (keep) put(BUILT + ':' + b64(raw)); });
    }).catch(function () {
      btn.disabled = false;
      say('That password did not work. Check it and try again.');
    });
  });

  // remembered on this device: open straight away (a new version needs the password once more)
  var saved = get();
  if (saved && saved.indexOf(BUILT + ':') === 0) {
    say('Opening…', true);
    open(bytes(saved.slice(BUILT.length + 1))).catch(function () { put(null); say(''); });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
